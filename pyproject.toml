[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cache-otp"
version = "0.3.0"
description = "OTP system based on cache"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ali Joghataee", email = "alijoghataee77@gmail.com" }]
dependencies = ["django>=4.0", "cryptography>=41.0.5"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/alijoghataee/django_cache_otp"
GitHub = "https://github.com/alijoghataee/django_cache_otp"

[tool.setuptools]
packages = ["django_cache_otp", "django_cache_otp.migrations"]
